name: Remove obsolete GitHub releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-obsolete-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-obsolete-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Remove legacy versioned releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Removing obsolete version-numbered GitHub releases. Source commits remain intact."
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            else
              echo "Keeping non-versioned release: $tag"
            fi
          done
          echo "Remaining GitHub releases:"
          gh release list --limit 100
