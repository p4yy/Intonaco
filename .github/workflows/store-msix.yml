name: Store MSIX

on:
  push:
    branches: ['main']
    paths:
      - 'store/**'
      - '.github/workflows/store-msix.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'store/**'
      - '.github/workflows/store-msix.yml'
  workflow_dispatch:
    inputs:
      package_identity_name:
        description: 'Exact Partner Center Package Identity Name'
        required: false
        type: string
      publisher_distinguished_name:
        description: 'Exact Publisher DN from Partner Center, starting with CN='
        required: false
        type: string
      publisher_display_name:
        description: 'Exact Partner Center publisher display name'
        required: false
        type: string

permissions:
  contents: read

jobs:
  store-msix:
    name: Validate Windows Store package
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Intonaco native GPU renderer (x64, no external app)
        shell: pwsh
        run: ./tools/Build-NativeVideo.ps1

      - name: Restore Store build
        run: dotnet restore src/Intonaco/Intonaco.csproj /p:StoreBuild=true
      - name: Publish Store app
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true /p:StoreBuild=true /p:PublishSingleFile=false
          /p:PublishReadyToRun=true -o artifacts/store-app
      - name: Verify native video module in Store package
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/store-app/Intonaco.Video.dll)) {
            throw 'Store package is missing original Intonaco GPU renderer.'
          }
      - name: Build and validate MSIX
        shell: pwsh
        env:
          STORE_ID: ${{ inputs.package_identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher_distinguished_name }}
          STORE_DISPLAY_PUBLISHER: ${{ inputs.publisher_display_name }}
        run: |
          $count = 0
          foreach ($value in @($env:STORE_ID, $env:STORE_PUBLISHER, $env:STORE_DISPLAY_PUBLISHER)) {
            if (-not [string]::IsNullOrWhiteSpace($value)) { $count++ }
          }
          if ($count -notin @(0, 3)) {
            throw 'Provide all three identity overrides or leave all blank to use the saved Partner Center identity.'
          }
          # Partner Center package identity is public metadata, not a secret.
          # Keep it in one reviewed source file rather than a fake preview DN.
          $registered = Get-Content -LiteralPath store/partner-center-identity.json -Raw |
            ConvertFrom-Json
          if ($count -eq 0) {
            $identity = [string]$registered.package_identity_name
            $publisher = [string]$registered.publisher_distinguished_name
            $display = [string]$registered.publisher_display_name
          } else {
            $identity = $env:STORE_ID
            $publisher = $env:STORE_PUBLISHER
            $display = $env:STORE_DISPLAY_PUBLISHER
          }
          Write-Host "Packaging Store identity: $identity (publisher: $display)"
          Write-Host 'This CI artifact is UNSIGNED and NOT automatically submitted to Partner Center.'
          [xml]$project = Get-Content -LiteralPath src/Intonaco/Intonaco.csproj
          $version = [string]($project.Project.PropertyGroup.Version |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1)
          $output = "artifacts/store/Intonaco-Wallpaper.msix"
          & ./store/Build-StorePackage.ps1 `
            -PublishDir artifacts/store-app `
            -PackageIdentityName $identity `
            -PublisherDistinguishedName $publisher `
            -PublisherDisplayName $display `
            -Version "$version.0" `
            -OutputPath $output
      - name: Verify real Partner Center identity and create Store upload
        shell: pwsh
        run: |
          $identity = Get-Content -LiteralPath store/partner-center-identity.json -Raw |
            ConvertFrom-Json
          $package = Get-ChildItem artifacts/store -Filter '*.msix' -File |
            Select-Object -First 1
          if (-not $package) { throw 'Store MSIX package was not created.' }
          ./store/Make-StoreUpload.ps1 `
            -MsixPath $package.FullName `
            -ExpectedIdentityName $identity.package_identity_name `
            -ExpectedPublisherDn $identity.publisher_distinguished_name `
            -ExpectedPublisherDisplayName $identity.publisher_display_name

      - name: Upload Partner Center submission file (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Intonaco-Wallpaper-Microsoft-Store
          path: artifacts/store/*.msixupload
          if-no-files-found: error
          retention-days: 30
