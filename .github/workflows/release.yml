name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "src/Intonaco/Intonaco.csproj"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish official release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "branch") {
            [xml]$project = Get-Content -LiteralPath src/Intonaco/Intonaco.csproj
            $version = [string]($project.Project.PropertyGroup.Version |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -First 1)
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid release version in Intonaco.csproj: $version"
            }
            $tag = "v$version"
          }
          else {
            $tag = "${{ inputs.tag || github.ref_name }}"
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag '$tag' must look like v2.1.0"
            }
            $version = $tag.Substring(1)
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building release $tag"

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: >-
          dotnet build Intonaco.sln -c Release --no-restore
          /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Intonaco.sln -c Release --no-build

      - name: Publish (framework-dependent, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained false -o publish/framework-dependent
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/self-contained
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish installer payload (self-contained, ReadyToRun)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/installer-app
          /p:Version=${{ steps.version.outputs.version }}
          /p:PublishSingleFile=false /p:PublishReadyToRun=true

      - name: Build and smoke test Windows installer
        shell: pwsh
        run: |
          try {
            Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/installer-app/

            $setup = & ./installer/Build-Installer.ps1 `
              -PublishDir publish/installer-app `
              -Version "${{ steps.version.outputs.version }}" `
              -OutputDir release

            & ./installer/Test-Installer.ps1 -SetupPath $setup
          }
          catch {
            $detail = ("$($_.Exception.Message)`n$($_.ScriptStackTrace)" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Host "::error title=Installer build/smoke test failed::$detail"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Installer build/smoke test failed`n`n``````text`n$($_.Exception.Message)`n$($_.ScriptStackTrace)`n``````"
            throw
          }

      - name: Package zips and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null

          # Ship the license/notices next to the executable.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/framework-dependent/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/self-contained/

          $fd = "release/Intonaco-Wallpaper-v$version-win-x64-framework-dependent.zip"
          $sc = "release/Intonaco-Wallpaper-v$version-win-x64-self-contained.zip"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath $fd
          Compress-Archive -Path publish/self-contained/* -DestinationPath $sc

          # Direct portable .exe download (the self-contained single file,
          # no unzip needed). The recommended installer was built and smoke
          # tested into this same release folder by the previous step.
          $exe = "release/Intonaco-Wallpaper-v$version-win-x64.exe"
          Copy-Item publish/self-contained/Intonaco.exe $exe
          $setup = "release/Intonaco-Wallpaper-v$version-win-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Installer was not found at $setup"
          }

          # One installer and one portable EXE; no duplicate aliases.
          $lines = foreach ($file in @($setup, $fd, $sc, $exe)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Intonaco Wallpaper ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          body: |
            ## Intonaco Wallpaper v${{ steps.version.outputs.version }}

            Discover live wallpaper sources from Intonaco Wallpaper, and reliably restore from desktop shortcuts.

            ### Highlights
            - New, compact **Get live wallpapers** section with copyable addresses for six trusted third-party catalogs.
            - Copy actions never auto-redirect or open a browser; supported videos are opened locally after download.
            - Desktop shortcut re-launch signals are preserved even during initial window loading.
            - Single-column recent items stay clean at the compact default window size.
            - Branded installer panel uses the official Intonaco logo and lists publisher **Acev Dev Co**.
            - No new background network activity or playback overhead.

            ### Download
            - `Intonaco-Wallpaper-v${{ steps.version.outputs.version }}-win-x64-setup.exe` — Windows installer.
            - `Intonaco-Wallpaper-v${{ steps.version.outputs.version }}-win-x64.exe` — portable standalone EXE.
            - `Intonaco-Wallpaper-v${{ steps.version.outputs.version }}-win-x64-self-contained.zip` — portable archive.
            - `Intonaco-Wallpaper-v${{ steps.version.outputs.version }}-win-x64-framework-dependent.zip` — requires .NET 8 Desktop Runtime.

            The installer and portable EXE do not require a separate .NET installation.
            Check `SHA256SUMS.txt` to verify downloads.

            **Hardware testing:** Windows CI covers compilation, tests and installer smoke
            checks. The new MPV backend still requires real Windows hardware validation.
            It is optional and not bundled. Media codec support and memory/GPU savings
            are hardware-dependent. Windows may display "Unknown publisher" until
            the EXE or installer receives a trusted Authenticode signature.
            The separate Store MSIX upload requires the exact Partner Center
            package identity and publisher; no Store publication is performed here.

            [Changelog](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md)
            · [Verification](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/VERIFICATION.md)
          files: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
