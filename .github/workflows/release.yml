name: Release Intonaco Wallpaper

on:
  push:
    branches: [main]
    paths:
      - "src/Intonaco/Intonaco.csproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and verify all three packages
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve internal servicing version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Intonaco/Intonaco.csproj
          $version = [string]($project.Project.PropertyGroup.Version |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid internal package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build Intonaco native GPU renderer (x64, no external app)
        shell: pwsh
        run: ./tools/Build-NativeVideo.ps1

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: dotnet build Intonaco.sln -c Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run regression tests
        run: dotnet test Intonaco.sln -c Release --no-build

      - name: Publish portable single-file EXE
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/portable
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish installer payload
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/installer-app
          /p:Version=${{ steps.version.outputs.version }}
          /p:PublishSingleFile=false /p:PublishReadyToRun=true

      - name: Verify native video renderer in release payload
        shell: pwsh
        run: |
          if (-not (Test-Path publish/installer-app/Intonaco.Video.dll)) {
            throw 'Release is missing GPU renderer. Do not publish.'
          }
      - name: Create and smoke-test EXE installer
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/installer-app/
          $setup = & ./installer/Build-Installer.ps1 `
            -PublishDir publish/installer-app `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputDir release
          & ./installer/Test-Installer.ps1 -SetupPath $setup
          if (-not (Test-Path release/Intonaco-Wallpaper-Setup.exe)) {
            throw 'Final EXE installer was not created.'
          }
          Copy-Item publish/portable/Intonaco.exe release/Intonaco-Wallpaper-Portable.exe
          if (-not (Test-Path release/Intonaco-Wallpaper-Portable.exe)) {
            throw 'Final portable EXE was not created.'
          }

      - name: Restore Microsoft Store dependencies
        shell: pwsh
        run: |
          dotnet restore src/Intonaco/Intonaco.csproj /p:StoreBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Store restore failed.' }

      - name: Publish Microsoft Store application
        shell: pwsh
        run: |
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64 --self-contained true /p:StoreBuild=true /p:PublishSingleFile=false /p:PublishReadyToRun=true -o artifacts/store-app
          if ($LASTEXITCODE -ne 0) { throw 'Store publish failed.' }

      - name: Build and verify Partner Center MSIX upload
        shell: pwsh
        run: |
          $identity = Get-Content store/partner-center-identity.json -Raw | ConvertFrom-Json
          ./store/Build-StorePackage.ps1 `
            -PublishDir artifacts/store-app `
            -PackageIdentityName $identity.package_identity_name `
            -PublisherDistinguishedName $identity.publisher_distinguished_name `
            -PublisherDisplayName $identity.publisher_display_name `
            -Version "${{ steps.version.outputs.version }}.0" `
            -OutputPath release/Intonaco-Wallpaper.msix
          ./store/Make-StoreUpload.ps1 `
            -MsixPath release/Intonaco-Wallpaper.msix `
            -ExpectedIdentityName $identity.package_identity_name `
            -ExpectedPublisherDn $identity.publisher_distinguished_name `
            -ExpectedPublisherDisplayName $identity.publisher_display_name
          Remove-Item release/Intonaco-Wallpaper.msix -Force

      - name: Verify exactly three public downloads
        shell: pwsh
        run: |
          $expected = @(
            'Intonaco-Wallpaper-Setup.exe',
            'Intonaco-Wallpaper-Portable.exe',
            'Intonaco-Wallpaper.msixupload'
          )
          $actual = @(Get-ChildItem release -File | ForEach-Object Name)
          foreach ($item in $expected) {
            if ($item -cnotin $actual) { throw "Missing download: $item" }
          }
          if (@($actual).Count -ne 3) {
            throw "Unexpected release files: $($actual -join ', ')"
          }
          $checksums = foreach ($item in $expected) {
            $hash = (Get-FileHash ("release/" + $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $item"
          }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      # Each public version has a unique immutable tag and genuine publish date.
      # Never force-move an existing version tag or overwrite prior binaries.
      - name: Create new version tag from tested main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tag = "${{ steps.version.outputs.tag }}"
          git tag $tag "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Version tag $tag already exists or could not be published. Refusing to replace it."
          }

      - name: Publish official versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Intonaco Wallpaper v${{ steps.version.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          body: |
            Intonaco Wallpaper for Windows 10 and 11.

            Three downloads:
            - **Intonaco-Wallpaper-Setup.exe** — Windows installation wizard.
            - **Intonaco-Wallpaper-Portable.exe** — self-contained portable executable.
            - **Intonaco-Wallpaper.msixupload** — Microsoft Store Partner Center package.

            Intonaco Wallpaper 2.2.0 — official Windows x64 release.

            - Refined wallpaper library and settings interface with clear Fluent icons.
            - Built-in Intonaco GPU (Direct3D 11 / Media Foundation) is now the default.
            - Deep pause releases the decoder while retaining the last wallpaper frame.
            - Controlled 4K decoder handoff when switching wallpapers.
            - Original source colors, full-resolution video and compatibility options.
            - No external playback application is required.

            The Microsoft Store .msixupload uses the registered Acev Apps Co.
            package identity and is **unsigned**. Upload it via Microsoft Partner
            Center; Microsoft Store submission and certification are separate.
            Some proprietary MLW variants may still require their original player.

            Source codec and hardware affect performance; no universal under-100 MB
            or zero-lag guarantee is claimed.

            Both GitHub EXEs are unsigned; Windows SmartScreen may warn.
            Microsoft signs qualifying MSIX packages during Store certification.
          files: |
            release/*.exe
            release/*.msixupload
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Verify fresh release assets then retire outdated release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $tag -or
              $release.draft -or $release.prerelease) {
            throw "New release $tag could not be verified."
          }
          $reference = gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $reference.object.sha -cne "${{ github.sha }}") {
            throw "The $tag source tag does not match this build's commit."
          }
          $expected = @('Intonaco-Wallpaper-Setup.exe',
                        'Intonaco-Wallpaper-Portable.exe',
                        'Intonaco-Wallpaper.msixupload',
                        'SHA256SUMS.txt')
          foreach ($name in $expected) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) {
              throw "New release $tag is missing required downloadable file: $name"
            }
            Write-Host "Verified $name, $($asset[0].size) bytes"
          }
          if (@($release.assets).Count -ne $expected.Count) {
            throw "New release has unexpected/duplicate assets; retaining old release."
          }
          # Owner requested the old original-publication-date release be removed.
          # Do this ONLY after all new v2.2.0 files are publicly available.
          $old = @(gh release list --limit 100 --json tagName |
              ConvertFrom-Json | Where-Object { $_.tagName -ceq 'Intonaco-Wallpaper' })
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          if ($old.Count -gt 0) {
            gh release delete Intonaco-Wallpaper --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw 'New release is published but old release deletion failed.'
            }
            Write-Host 'Outdated release and old version-free tag deleted.'
          }
          Write-Host "Fresh official release published: $($release.html_url)"

