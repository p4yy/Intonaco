name: Release Intonaco Wallpaper

on:
  push:
    branches: [main]
    paths:
      - "src/Intonaco/Intonaco.csproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and verify all three packages
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve internal servicing version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Intonaco/Intonaco.csproj
          $version = [string]($project.Project.PropertyGroup.Version |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid internal package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=Intonaco-Wallpaper" >> $env:GITHUB_OUTPUT

      - name: Build Intonaco native GPU renderer (x64, no external app)
        shell: pwsh
        run: ./tools/Build-NativeVideo.ps1

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: dotnet build Intonaco.sln -c Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run regression tests
        run: dotnet test Intonaco.sln -c Release --no-build

      - name: Publish portable single-file EXE
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/portable
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish installer payload
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/installer-app
          /p:Version=${{ steps.version.outputs.version }}
          /p:PublishSingleFile=false /p:PublishReadyToRun=true

      - name: Create and smoke-test EXE installer
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/installer-app/
          $setup = & ./installer/Build-Installer.ps1 `
            -PublishDir publish/installer-app `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputDir release
          & ./installer/Test-Installer.ps1 -SetupPath $setup
          if (-not (Test-Path release/Intonaco-Wallpaper-Setup.exe)) {
            throw 'Final EXE installer was not created.'
          }
          Copy-Item publish/portable/Intonaco.exe release/Intonaco-Wallpaper-Portable.exe
          if (-not (Test-Path release/Intonaco-Wallpaper-Portable.exe)) {
            throw 'Final portable EXE was not created.'
          }

      - name: Restore Microsoft Store dependencies
        shell: pwsh
        run: |
          dotnet restore src/Intonaco/Intonaco.csproj /p:StoreBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Store restore failed.' }

      - name: Publish Microsoft Store application
        shell: pwsh
        run: |
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64 --self-contained true /p:StoreBuild=true /p:PublishSingleFile=false /p:PublishReadyToRun=true -o artifacts/store-app
          if ($LASTEXITCODE -ne 0) { throw 'Store publish failed.' }

      - name: Build and verify Partner Center MSIX upload
        shell: pwsh
        run: |
          $identity = Get-Content store/partner-center-identity.json -Raw | ConvertFrom-Json
          ./store/Build-StorePackage.ps1 `
            -PublishDir artifacts/store-app `
            -PackageIdentityName $identity.package_identity_name `
            -PublisherDistinguishedName $identity.publisher_distinguished_name `
            -PublisherDisplayName $identity.publisher_display_name `
            -Version "${{ steps.version.outputs.version }}.0" `
            -OutputPath release/Intonaco-Wallpaper.msix
          ./store/Make-StoreUpload.ps1 `
            -MsixPath release/Intonaco-Wallpaper.msix `
            -ExpectedIdentityName $identity.package_identity_name `
            -ExpectedPublisherDn $identity.publisher_distinguished_name `
            -ExpectedPublisherDisplayName $identity.publisher_display_name
          Remove-Item release/Intonaco-Wallpaper.msix -Force

      - name: Verify exactly three public downloads
        shell: pwsh
        run: |
          $expected = @(
            'Intonaco-Wallpaper-Setup.exe',
            'Intonaco-Wallpaper-Portable.exe',
            'Intonaco-Wallpaper.msixupload'
          )
          $actual = @(Get-ChildItem release -File | ForEach-Object Name)
          foreach ($item in $expected) {
            if ($item -cnotin $actual) { throw "Missing download: $item" }
          }
          if (@($actual).Count -ne 3) {
            throw "Unexpected release files: $($actual -join ', ')"
          }
          $checksums = foreach ($item in $expected) {
            $hash = (Get-FileHash ("release/" + $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $item"
          }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - name: Publish one clean GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Intonaco-Wallpaper
          name: Intonaco Wallpaper
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          body: |
            Intonaco Wallpaper for Windows 10 and 11.

            Three downloads:
            - **Intonaco-Wallpaper-Setup.exe** — Windows installation wizard.
            - **Intonaco-Wallpaper-Portable.exe** — self-contained portable executable.
            - **Intonaco-Wallpaper.msixupload** — Microsoft Store Partner Center package.

            Fixes include deferred startup playback, smoother window rendering,
            desktop-shortcut restoration, and reduced preview decoder overhead.

            The Store package uses the registered Acev Apps Co. identity.
            Submission and certification are handled in Microsoft Partner Center.
            Some proprietary MLW variants may still require their original player.

            Both Windows binaries are unsigned, so SmartScreen may warn until
            the developer provides trusted Authenticode signatures.
          files: |
            release/*.exe
            release/*.msixupload
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
