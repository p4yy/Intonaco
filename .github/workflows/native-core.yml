name: Native engine core

on:
  pull_request:
    paths:
      - 'native/intonaco-video-core/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify original Rust core tests
        run: cargo test --manifest-path native/intonaco-video-core/Cargo.toml --locked
