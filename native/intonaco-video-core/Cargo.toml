[package]
name = "intonaco-video-core"
version = "0.1.0"
edition = "2021"
description = "Original native video geometry and frame scheduling core for Intonaco Wallpaper"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
